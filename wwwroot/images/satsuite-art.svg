<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="white" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
  <!-- Satellite body -->
  <rect x="85" y="75" width="30" height="20" rx="2" opacity="0.5"/>

  <!-- Solar panels -->
  <rect x="40" y="78" width="40" height="14" opacity="0.3"/>
  <rect x="120" y="78" width="40" height="14" opacity="0.3"/>

  <!-- Panel lines -->
  <line x1="50" y1="78" x2="50" y2="92" opacity="0.2"/>
  <line x1="60" y1="78" x2="60" y2="92" opacity="0.2"/>
  <line x1="70" y1="78" x2="70" y2="92" opacity="0.2"/>
  <line x1="130" y1="78" x2="130" y2="92" opacity="0.2"/>
  <line x1="140" y1="78" x2="140" y2="92" opacity="0.2"/>
  <line x1="150" y1="78" x2="150" y2="92" opacity="0.2"/>

  <!-- Scan beam -->
  <path d="M 100 95 L 70 150 L 130 150 Z" opacity="0.15"/>

  <!-- Ground grid (segmentation) -->
  <line x1="70" y1="150" x2="130" y2="150" opacity="0.25"/>
  <line x1="75" y1="145" x2="125" y2="145" opacity="0.2"/>
  <line x1="85" y1="140" x2="115" y2="140" opacity="0.15"/>

  <!-- Segmentation cells -->
  <rect x="78" y="148" width="12" height="8" opacity="0.2"/>
  <rect x="94" y="148" width="12" height="8" opacity="0.3"/>
  <rect x="110" y="148" width="12" height="8" opacity="0.2"/>
</svg>