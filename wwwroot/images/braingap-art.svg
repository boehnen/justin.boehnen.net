<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="white" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
  <!-- Brain outline - left hemisphere -->
  <path d="M 100 35
           C 70 35, 45 50, 40 75
           C 35 95, 40 115, 45 130
           C 50 145, 55 160, 75 170
           C 90 178, 100 175, 100 170"
        opacity="0.7"/>

  <!-- Brain outline - right hemisphere -->
  <path d="M 100 35
           C 130 35, 155 50, 160 75
           C 165 95, 160 115, 155 130
           C 150 145, 145 160, 125 170
           C 110 178, 100 175, 100 170"
        opacity="0.7"/>

  <!-- Brain stem -->
  <path d="M 100 170 L 100 185" opacity="0.5"/>

  <!-- Left hemisphere folds -->
  <path d="M 50 70 Q 65 65, 75 75" opacity="0.4"/>
  <path d="M 45 95 Q 60 88, 80 95" opacity="0.35"/>
  <path d="M 50 120 Q 70 110, 85 120" opacity="0.3"/>
  <path d="M 60 145 Q 75 135, 90 145" opacity="0.25"/>

  <!-- Right hemisphere folds -->
  <path d="M 150 70 Q 135 65, 125 75" opacity="0.4"/>
  <path d="M 155 95 Q 140 88, 120 95" opacity="0.35"/>
  <path d="M 150 120 Q 130 110, 115 120" opacity="0.3"/>
  <path d="M 140 145 Q 125 135, 110 145" opacity="0.25"/>

  <!-- Center division -->
  <path d="M 100 40 L 100 165" opacity="0.2" stroke-dasharray="3 4"/>

  <!-- Subtle top bulge details -->
  <path d="M 70 45 Q 85 38, 100 40" opacity="0.3"/>
  <path d="M 130 45 Q 115 38, 100 40" opacity="0.3"/>
</svg>